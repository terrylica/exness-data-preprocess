# mise configuration for exness-data-preprocess
# E2E validation workflow for codebase pruning verification

[env]
# Python version for validation (pinned for alpha-forge compatibility)
PYTHON_VERSION = "3.11"
# Package name
PACKAGE_NAME = "exness_data_preprocess"
# Validation temp directory
VALIDATION_TMP = "./tmp/validation"

# ADR: /docs/adr/2025-12-10-clickhouse-pydantic-config.md
# ClickHouse SSoT Configuration
# Connection identity
CLICKHOUSE_NAME = "exness-clickhouse-local"
CLICKHOUSE_MODE = "local"  # "local" or "cloud"
CLICKHOUSE_TYPE = "dev"    # "dev", "test", or "prod"
# Connection parameters (match existing clickhouse_client.py defaults)
CLICKHOUSE_HOST = "localhost"
CLICKHOUSE_PORT = "8123"
CLICKHOUSE_DATABASE = "exness"
# Output paths
DBEAVER_CONFIG_PATH = ".dbeaver/data-sources.json"
# Cloud credentials (read from .env for security)
# CLICKHOUSE_USER_READONLY - set in .env
# CLICKHOUSE_PASSWORD_READONLY - set in .env

[tools]
# Pin Python 3.11 for alpha-forge compatibility (numpy requirements)
python = "3.11"

# =============================================================================
# Validation Tasks - E2E Testing Pipeline
# =============================================================================

[tasks.validate]
description = "Run full E2E validation pipeline"
# ADR: /docs/adr/2025-12-11-duckdb-removal-clickhouse.md
depends = [
    "clickhouse:ensure",        # Fail fast if ClickHouse not running
    "validate:imports",
    "validate:lint",
    "validate:typecheck",
    "validate:test",
    "validate:build",
    "validate:install",
    "validate:mixin",
    "validate:clickhouse",      # ClickHouse E2E validation
]
run = '''
echo ""
echo "=============================================="
echo "✅ ALL VALIDATIONS PASSED"
echo "=============================================="
'''

# -----------------------------------------------------------------------------
# Individual Validation Tasks
# -----------------------------------------------------------------------------

[tasks."clickhouse:ensure"]
description = "Ensure ClickHouse is running (fail fast)"
# ADR: /docs/adr/2025-12-11-duckdb-removal-clickhouse.md
run = '''
#!/usr/bin/env bash
set -e
if ! nc -z localhost 8123 2>/dev/null; then
    echo "ERROR: ClickHouse not running on port 8123" >&2
    echo "Start with: mise run clickhouse:start" >&2
    exit 1
fi
echo "✅ ClickHouse connection verified"
'''

[tasks."validate:imports"]
description = "Validate all module imports (catch circular imports, missing deps)"
# ADR: /docs/adr/2025-12-11-duckdb-removal-clickhouse.md - DuckDB modules removed
run = '''
#!/usr/bin/env bash
set -e
echo "🔍 Validating module imports..."

# Test package import
uv run python -c "import exness_data_preprocess" || { echo "❌ Package import failed"; exit 1; }

# Test all public exports
uv run python -c "
from exness_data_preprocess import (
    ExnessDataProcessor,
    UpdateResult,
    CoverageInfo,
    DryRunResult,
    PairType,
    TimeframeType,
    VariantType,
    supported_pairs,
    supported_timeframes,
    supported_variants,
    # ClickHouse exports
    ClickHouseManager,
    ClickHouseGapDetector,
    ClickHouseQueryEngine,
    ClickHouseOHLCGenerator,
    ClickHouseConnectionError,
    ClickHouseQueryError,
    get_clickhouse_client,
)
print('✅ All public exports importable')
" || { echo "❌ Public exports import failed"; exit 1; }

# Test all internal modules (ClickHouse-only, DuckDB modules removed)
uv run python -c "
modules = [
    'exness_data_preprocess.clickhouse_base',
    'exness_data_preprocess.clickhouse_client',
    'exness_data_preprocess.clickhouse_gap_detector',
    'exness_data_preprocess.clickhouse_manager',
    'exness_data_preprocess.clickhouse_ohlc_generator',
    'exness_data_preprocess.clickhouse_query_engine',
    'exness_data_preprocess.config',
    'exness_data_preprocess.downloader',
    'exness_data_preprocess.exchanges',
    'exness_data_preprocess.models',
    'exness_data_preprocess.processor',
    'exness_data_preprocess.session_detector',
    'exness_data_preprocess.tick_loader',
]
import importlib
for mod in modules:
    importlib.import_module(mod)
    print(f'  ✓ {mod}')
print('✅ All 13 modules importable')
"
echo "✅ Import validation passed"
'''

[tasks."validate:lint"]
description = "Run ruff linting"
run = '''
#!/usr/bin/env bash
set -e
echo "🔍 Running ruff check..."
uv run ruff check src/ tests/ --output-format=concise
echo "✅ Lint validation passed"
'''

[tasks."validate:typecheck"]
description = "Run mypy type checking"
run = '''
#!/usr/bin/env bash
set -e
echo "🔍 Running mypy..."
uv run mypy src/exness_data_preprocess/ --ignore-missing-imports --no-error-summary 2>&1 | head -50
echo "✅ Type check validation passed (warnings may exist)"
'''

[tasks."validate:test"]
description = "Run pytest test suite"
run = '''
#!/usr/bin/env bash
set -e
echo "🔍 Running pytest..."
uv run pytest tests/ -v --tb=short -q
echo "✅ Test validation passed"
'''

[tasks."validate:test-coverage"]
description = "Run pytest with coverage report"
run = '''
#!/usr/bin/env bash
set -e
echo "🔍 Running pytest with coverage..."
uv run pytest tests/ --cov=exness_data_preprocess --cov-report=term-missing --cov-report=html:tmp/coverage
echo ""
echo "📊 Coverage report: tmp/coverage/index.html"
'''

[tasks."validate:build"]
description = "Validate package builds correctly"
run = '''
#!/usr/bin/env bash
set -e
echo "🔍 Building package..."
rm -rf dist/
uv build 2>&1 | tail -5
echo ""
ls -la dist/
echo "✅ Build validation passed"
'''

[tasks."validate:install"]
description = "Test fresh install in isolated environment"
depends = ["validate:build"]
run = '''
#!/usr/bin/env bash
set -e
echo "🔍 Testing fresh install..."

# Create isolated temp venv
TMPDIR=$(mktemp -d)
trap "rm -rf $TMPDIR" EXIT

# Create fresh venv and install wheel using uv
uv venv "$TMPDIR/venv" --python 3.14 -q
WHEEL=$(ls dist/*.whl | head -1)
uv pip install "$WHEEL" --python "$TMPDIR/venv/bin/python" -q

# Test import in fresh environment
"$TMPDIR/venv/bin/python" -c "
import exness_data_preprocess as edp
print(f'Version: {edp.__version__}')
print(f'Processor: {edp.ExnessDataProcessor}')
print(f'ClickHouseManager: {edp.ClickHouseManager}')
print('✅ Fresh install works')
"
echo "✅ Install validation passed"
'''

# -----------------------------------------------------------------------------
# Mixin Validation
# -----------------------------------------------------------------------------

[tasks."validate:mixin"]
description = "Validate ClickHouseClientMixin inheritance"
run = '''
#!/usr/bin/env bash
set -e
echo "🔍 Validating ClickHouseClientMixin..."

uv run python -c "
from exness_data_preprocess.clickhouse_base import ClickHouseClientMixin
from exness_data_preprocess.clickhouse_manager import ClickHouseManager
from exness_data_preprocess.clickhouse_gap_detector import ClickHouseGapDetector
from exness_data_preprocess.clickhouse_query_engine import ClickHouseQueryEngine
from exness_data_preprocess.clickhouse_ohlc_generator import ClickHouseOHLCGenerator

# Verify inheritance
classes = [
    ('ClickHouseManager', ClickHouseManager),
    ('ClickHouseGapDetector', ClickHouseGapDetector),
    ('ClickHouseQueryEngine', ClickHouseQueryEngine),
    ('ClickHouseOHLCGenerator', ClickHouseOHLCGenerator),
]

for name, cls in classes:
    assert issubclass(cls, ClickHouseClientMixin), f'{name} should inherit from ClickHouseClientMixin'
    print(f'  ✓ {name} inherits ClickHouseClientMixin')

# Verify mixin methods exist at class level (properties/methods are on class, not instance)
for name, cls in classes:
    assert hasattr(cls, 'client'), f'{name} missing client property'
    assert hasattr(cls, 'close'), f'{name} missing close method'
    assert hasattr(cls, '_init_client'), f'{name} missing _init_client method'
    print(f'  ✓ {name} has mixin methods')

print('✅ Mixin validation passed')
"
'''

# -----------------------------------------------------------------------------
# Quick Tasks
# -----------------------------------------------------------------------------

[tasks.test]
description = "Run tests (alias for validate:test)"
alias = "t"
run = "uv run pytest tests/ -v --tb=short"

[tasks.lint]
description = "Run linting (alias for validate:lint)"
alias = "l"
run = "uv run ruff check src/ tests/"

[tasks.fix]
description = "Auto-fix linting issues"
run = "uv run ruff check --fix src/ tests/ && uv run ruff format src/ tests/"

# -----------------------------------------------------------------------------
# CI Simulation
# -----------------------------------------------------------------------------

[tasks.ci]
description = "Simulate CI pipeline locally"
depends = ["validate"]
depends_post = ["validate:test-coverage"]
run = '''
echo ""
echo "=============================================="
echo "✅ CI SIMULATION COMPLETE"
echo "=============================================="
'''

# =============================================================================
# ClickHouse Server Management
# ADR: /docs/adr/2025-12-10-clickhouse-e2e-validation-pipeline.md
# =============================================================================

[tasks."clickhouse:start"]
description = "Start the local ClickHouse server"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Resolve the clickhouse binary, PATH first.
#
# This used to hardcode "${HOME}/.local/share/mise/shims/clickhouse". mise was retired
# machine-wide (proto is the only toolchain manager), so that path stopped existing and
# this task failed on every invocation -- while instructing the reader to fix it with
# `mise install clickhouse`, a command that cannot work here. The identical defect was
# found and fixed in gapless-crypto-clickhouse on 2026-08-25, where it hard-failed 12
# tests while ClickHouse was installed at /opt/homebrew/bin/clickhouse the whole time.
#
# PATH first is the tool-agnostic answer: proto shims, Homebrew and system installs all
# feed PATH, so this needs no edit the next time the toolchain manager changes. The
# explicit fallbacks cover a non-login shell whose PATH never went through profile
# activation. The mise path is kept LAST only so a machine that still has one keeps
# working; it must not be promoted back to primary.
CH=""
if command -v clickhouse >/dev/null 2>&1; then
    CH="$(command -v clickhouse)"
else
    for c in "${HOME}/.proto/shims/clickhouse" /opt/homebrew/bin/clickhouse \
             /usr/local/bin/clickhouse "${HOME}/.local/share/mise/shims/clickhouse"; do
        if [[ -x "$c" ]]; then CH="$c"; break; fi
    done
fi

if [[ -z "$CH" ]]; then
    echo "ERROR: clickhouse binary not found on PATH or at any known location." >&2
    echo "       Install it (e.g. 'brew install clickhouse') or put it on PATH." >&2
    exit 1
fi

# Check if already running
if nc -z localhost 8123 2>/dev/null; then
    echo "✅ ClickHouse already running on port 8123"
    "${CH}" client --query "SELECT version()"
    exit 0
fi

# Start server in daemon mode, from a data dir OUTSIDE the repository.
#
# `clickhouse server` writes its data tree (store/, metadata/, cores/, status, uuid)
# relative to the working directory and exposes no --path flag, so launched from a repo
# checkout it litters the repo root with untracked server state.
CLICKHOUSE_DATA_DIR="${CLICKHOUSE_DATA_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/exness-data-preprocess/clickhouse}"
mkdir -p "${CLICKHOUSE_DATA_DIR}"

echo "Starting ClickHouse server (data dir: ${CLICKHOUSE_DATA_DIR})..."
( cd "${CLICKHOUSE_DATA_DIR}" && "${CH}" server --daemon )

# Wait for server to be ready
for i in $(seq 1 10); do
    if nc -z localhost 8123 2>/dev/null; then
        echo "✅ ClickHouse server started"
        "${CH}" client --query "SELECT version()"
        exit 0
    fi
    sleep 1
done

echo "ERROR: ClickHouse failed to start" >&2
exit 1
'''

[tasks."clickhouse:stop"]
description = "Stop mise-installed ClickHouse server"
run = '''
#!/usr/bin/env bash
if pkill -f "clickhouse server" 2>/dev/null; then
    echo "✅ ClickHouse server stopped"
else
    echo "ClickHouse was not running"
fi
'''

[tasks."clickhouse:status"]
description = "Check ClickHouse connection via Python client"
run = '''
#!/usr/bin/env bash
set -e

if ! nc -z localhost 8123 2>/dev/null; then
    echo "❌ ClickHouse not running on port 8123"
    exit 1
fi

uv run python -c "
from exness_data_preprocess import get_clickhouse_client
from exness_data_preprocess.clickhouse_client import check_connection
client = get_clickhouse_client()
check_connection(client)
print('✅ ClickHouse connection OK')
client.close()
"
'''

# =============================================================================
# ClickHouse E2E Validation Tasks
# ADR: /docs/adr/2025-12-10-clickhouse-e2e-validation-pipeline.md
# =============================================================================

[tasks."validate:clickhouse"]
description = "Run all ClickHouse E2E validations with real data"
depends = ["clickhouse:status"]
run = '''
#!/usr/bin/env bash
set -e
echo "🔍 Running ClickHouse E2E validation..."
mise run validate:clickhouse-schema
mise run validate:clickhouse-data
mise run validate:clickhouse-pagination
mise run validate:clickhouse-ohlc
echo "✅ All ClickHouse validations passed"
'''

[tasks."validate:clickhouse-schema"]
description = "Validate ClickHouse schema creation"
depends = ["clickhouse:status"]
run = '''
#!/usr/bin/env bash
set -e
echo "🔍 Validating ClickHouse schema..."
uv run python -c "
from exness_data_preprocess import ClickHouseManager

manager = ClickHouseManager()
manager.ensure_schema()
print('  ✓ ticks table created')
print('  ✓ ohlc table created')
manager.close()
print('✅ Schema validation passed')
"
'''

[tasks."validate:clickhouse-data"]
description = "Validate ClickHouse data queries with real Exness data"
depends = ["validate:clickhouse-schema"]
run = '''
#!/usr/bin/env bash
set -e
echo "🔍 Validating ClickHouse data operations..."
uv run python -c "
from exness_data_preprocess import ClickHouseQueryEngine

engine = ClickHouseQueryEngine()

# Query with limit to verify functionality
df = engine.query_ticks('EURUSD', limit=1000)
print(f'  ✓ query_ticks returned {len(df)} rows')

# Verify columns
expected_cols = ['timestamp', 'bid', 'ask']
for col in expected_cols:
    assert col in df.columns, f'Missing column: {col}'
print('  ✓ All expected columns present')

engine.close()
print('✅ Data validation passed')
"
'''

[tasks."validate:clickhouse-pagination"]
description = "Validate ClickHouse pagination (LIMIT/OFFSET/cursor/batch)"
depends = ["validate:clickhouse-schema"]
run = '''
#!/usr/bin/env bash
set -e
echo "🔍 Validating ClickHouse pagination..."
uv run python -c "
from exness_data_preprocess import ClickHouseQueryEngine

engine = ClickHouseQueryEngine()

# Test LIMIT
df1 = engine.query_ticks('EURUSD', limit=100)
assert len(df1) <= 100, f'LIMIT failed: got {len(df1)} rows'
print(f'  ✓ LIMIT=100 returned {len(df1)} rows')

# Test OFFSET
df2 = engine.query_ticks('EURUSD', limit=100, offset=100)
assert len(df2) <= 100, f'OFFSET failed: got {len(df2)} rows'
print(f'  ✓ LIMIT=100 OFFSET=100 returned {len(df2)} rows')

# Test cursor-based pagination
result = engine.query_ticks_paginated('EURUSD', page_size=1000)
print(f'  ✓ Cursor pagination: {len(result.data)} rows, has_more={result.has_more}')

# Test batch iterator
batches = list(engine.query_ticks_batches('EURUSD', batch_size=1000, max_batches=3))
print(f'  ✓ Batch iterator: {len(batches)} batches')

engine.close()
print('✅ Pagination validation passed')
"
'''

[tasks."validate:clickhouse-ohlc"]
description = "Validate ClickHouse OHLC queries"
depends = ["validate:clickhouse-schema"]
run = '''
#!/usr/bin/env bash
set -e
echo "🔍 Validating ClickHouse OHLC queries..."
uv run python -c "
from exness_data_preprocess import ClickHouseQueryEngine

engine = ClickHouseQueryEngine()

# Query OHLC with limit
df = engine.query_ohlc('EURUSD', timeframe='1h', limit=100)
print(f'  ✓ query_ohlc(1h) returned {len(df)} bars')

# Verify OHLC columns exist (if data present)
if len(df) > 0:
    ohlc_cols = ['open', 'high', 'low', 'close']
    for col in ohlc_cols:
        assert col in df.columns, f'Missing OHLC column: {col}'
    print('  ✓ All OHLC columns present')
else:
    print('  ⚠ No OHLC data available (expected if no data loaded)')

engine.close()
print('✅ OHLC validation passed')
"
'''

# =============================================================================
# DBeaver Config Generation
# ADR: /docs/adr/2025-12-10-clickhouse-pydantic-config.md
# =============================================================================

[tasks.db-client-generate]
description = "Generate DBeaver config from Pydantic model"
run = "uv run scripts/generate_dbeaver_config.py --output ${DBEAVER_CONFIG_PATH}"

[tasks."db-client:cloud"]
description = "Generate config for ClickHouse Cloud"
run = "uv run scripts/generate_dbeaver_config.py --mode cloud --output ${DBEAVER_CONFIG_PATH}"

[tasks."db-client:dry-run"]
description = "Preview generated config without writing"
run = "uv run scripts/generate_dbeaver_config.py --dry-run"

[tasks.dbeaver]
description = "Launch DBeaver with project workspace"
run = '"/Applications/DBeaver.app/Contents/MacOS/dbeaver" -data .dbeaver-workspace &'
