# semantic-release configuration for Python project
# Uses @semantic-release/exec instead of @semantic-release/npm
branches:
  - main

plugins:
  - "@semantic-release/commit-analyzer"
  - "@semantic-release/release-notes-generator"
  - "@semantic-release/changelog"
  - - "@semantic-release/exec"
    # `uv version --frozen` rewrites [project].version in pyproject.toml only (uv.lock is not tracked).
    # __version__ is read from the installed distribution metadata, so nothing else needs bumping.
    - prepareCmd: "uv version ${nextRelease.version} --frozen"
  - - "@semantic-release/git"
    - assets:
        - pyproject.toml
        - CHANGELOG.md
      message: "chore(release): bump version ${lastRelease.version} → ${nextRelease.version} [skip ci]"
  - "@semantic-release/github"
